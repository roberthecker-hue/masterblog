<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main>
        <h1>Welcome to My Flask Blog!</h1>

        <p>
            <a href="{{ url_for('add') }}" class="add-link">+ Add a New Blog Post</a>
        </p>

        {% for post in posts %}
        <article class="post">
            <h2>{{ post.title }}</h2>
            <p><em>Written by {{ post.author }}</em></p>
            <p>{{ post.content }}</p>

            <div class="post-actions">
                <a href="{{ url_for('update', post_id=post.id) }}" class="button-link">Update</a>

                <form action="{{ url_for('delete', post_id=post.id) }}" method="POST">
                    <button type="submit" class="delete-btn">Delete</button>
                </form>
            </div>
        </article>
        {% endfor %}
    </main>
</body>
</html>
